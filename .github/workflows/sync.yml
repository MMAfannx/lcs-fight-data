name: Sync UFC data

on:
  schedule:
    - cron: "0 */2 * * *"         # full check every 2 hours
    - cron: "*/10 14-23 * * 6"    # fight nights: every 10 minutes, Saturday 14:00-24:00 UTC (Abu Dhabi/Europe cards start earlier)
    - cron: "*/10 0-8 * * 0"      # ...and Sunday 00:00-09:00 UTC
  workflow_dispatch:              # run by hand from GitHub
    inputs:
      mode:
        description: "full = normal check, backfill = import past events, fighters = update all fighter profiles now, quiz = make this week's quiz now, clips = find official highlight clips of recent events now, clips_backfill = build the YouTube index and add clips to ALL past fights (once), clips_debug = print why clips are missing (changes nothing)"
        default: "full"
        type: choice
        options: [full, backfill, fighters, quiz, clips, clips_backfill, clips_debug]
      from_year:
        description: "Backfill: import events from this year onward"
        default: "2024"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency: ufc-sync
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sync_ufc.py
        if: ${{ inputs.mode != 'clips_debug' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SYNC_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '0 */2 * * *' && 'full' || 'fightnight') }}
          BACKFILL_FROM_YEAR: ${{ inputs.from_year || '2024' }}
      # clips_debug: the report goes to the "clips-debug" branch (public titles only, no keys)
      - name: clips debug report
        if: ${{ inputs.mode == 'clips_debug' }}
        run: |
          python sync_ufc.py > /tmp/clips_debug.txt 2>&1 || true
          cat /tmp/clips_debug.txt
          git config user.name "MMAfannx"
          git config user.email "MMAfannx@users.noreply.github.com"
          git checkout --orphan clips-debug
          git rm -rq --cached .
          cp /tmp/clips_debug.txt clips_debug.txt
          git add clips_debug.txt
          git commit -qm "clips debug report"
          git push -f origin clips-debug
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SYNC_MODE: clips_debug
          CLIPS_PROBE: ${{ inputs.from_year == 'probe' && '1' || '' }}

name: Sync UFC data

on:
  schedule:
    - cron: "17 */2 * * *"        # full check every 2 hours (not :00, GitHub skips many runs then)
    - cron: "3-59/10 14-23 * * 6"    # fight nights: every 10 minutes, Saturday 14:00-24:00 UTC (Abu Dhabi/Europe cards start earlier)
    - cron: "3-59/10 0-8 * * 0"      # ...and Sunday 00:00-09:00 UTC
  workflow_dispatch:              # run by hand from GitHub
    inputs:
      mode:
        description: "full = normal check, backfill = import past events, fighters = update all fighter profiles now, quiz = make this week's quiz now, clips = find official highlight clips of recent events now, clips_backfill = build the YouTube index and add clips to ALL past fights (once), clips_debug = print why clips are missing (changes nothing), boxing = refresh boxing cards and champions now"
        default: "full"
        type: choice
        options: [full, backfill, fighters, quiz, clips, clips_backfill, clips_debug, boxing]
      from_year:
        description: "Backfill: import events from this year onward"
        default: "2024"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency: ufc-sync
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Boxing first: quick (a few Wikipedia pages), and it can never stop the
      # UFC sync below (errors are caught, and the step may fail on its own).
      - name: boxing
        if: ${{ inputs.mode != 'clips_debug' }}
        continue-on-error: true
        timeout-minutes: 10
        run: python sync_boxing.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SYNC_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '17 */2 * * *' && 'full' || 'fightnight') }}
      - run: python sync_ufc.py
        if: ${{ inputs.mode != 'clips_debug' && inputs.mode != 'boxing' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SYNC_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '17 */2 * * *' && 'full' || 'fightnight') }}
          BACKFILL_FROM_YEAR: ${{ inputs.from_year || '2024' }}
      # Website sidebar: this month's top 50 (nicknames + points) on the "site" branch.
      - name: publish website top 50
        if: ${{ inputs.mode != 'clips_debug' }}
        run: |
          [ -f /tmp/site/top50.json ] || exit 0
          git config user.name "MMAfannx"
          git config user.email "MMAfannx@users.noreply.github.com"
          git checkout -q --orphan site
          git rm -rq --cached .
          cp /tmp/site/top50.json top50.json
          git add top50.json
          git commit -qm "website top 50"
          git push -qf origin site
      # clips_debug: the report goes to the "clips-debug" branch (public titles only, no keys)
      - name: clips debug report
        if: ${{ inputs.mode == 'clips_debug' }}
        run: |
          python sync_ufc.py > /tmp/clips_debug.txt 2>&1 || true
          cat /tmp/clips_debug.txt
          git config user.name "MMAfannx"
          git config user.email "MMAfannx@users.noreply.github.com"
          git checkout --orphan clips-debug
          git rm -rq --cached .
          cp /tmp/clips_debug.txt clips_debug.txt
          git add clips_debug.txt
          if [ -d /tmp/photo_check ]; then cp -r /tmp/photo_check photo_check; git add photo_check; fi
          git commit -qm "clips debug report"
          git push -f origin clips-debug
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SYNC_MODE: clips_debug
          CLIPS_PROBE: ${{ inputs.from_year == 'probe' && '1' || '' }}
          CLIPS_AUDIT: ${{ inputs.from_year == 'audit' && '1' || '' }}
          CLIPS_PHOTOS: ${{ inputs.from_year == 'photos' && '1' || '' }}
          CLIPS_WIKIDATA: ${{ inputs.from_year == 'wikidata' && '1' || '' }}
